<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baranus Launcher</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="space.css"></head>
<body><main class="app"><aside class="sidebar" aria-label="Навигация"><div class="side-brand">B</div><div class="page-switches"><button class="page-dot active" title="Главная"></button><button class="page-dot" title="Скоро"></button><button class="page-dot" title="Скоро"></button></div><span class="side-caption">BRN</span></aside><section class="workspace"><div class="stars" aria-hidden="true"></div><div class="planet-scene" aria-hidden="true"><i></i><b></b></div><header><div class="brand-text">BARANUS <span>LAUNCHER</span></div><button id="settings" class="settings">НАСТРОЙКИ</button></header><section class="center"><p class="eyebrow">MINECRAFT · FORGE 1.12.2</p><h1 id="greeting">Добро пожаловать!</h1><p class="sub">Космическая сборка</p></section><section class="quick-settings"><label>НИКНЕЙМ<input id="nickname" maxlength="16" placeholder="Player"></label><label>ОЗУ <b id="ramValue">4 ГБ</b><input id="ram" type="range" min="1" max="4" step="1"><small id="ramHint">Максимум: 4 ГБ</small></label></section><section class="bottom-area"><div class="install-state"><div><span id="status">Проверяем состояние сборки…</span><span id="progressText">0%</span></div><div class="progress"><div id="progressFill"></div></div></div><button id="mainAction" class="main-action"><span class="action-icon">▶</span><span><strong id="mainActionTitle">Установить</strong><small id="mainActionHint">Minecraft сборку</small></span></button></section><footer><span id="version">v—</span><button id="mods">ПАПКА МОДОВ</button><button id="shaders">ПАПКА ШЕЙДЕРОВ</button><button id="resources">ПАПКА РЕСУРСПАКОВ</button><button id="update" hidden>ОБНОВИТЬ ЛАУНЧЕР</button><details><summary>ЛОГ</summary><pre id="log"></pre></details></footer></section></main><aside id="settingsPanel" hidden><b>НАСТРОЙКИ</b><p>Дополнительные параметры появятся позже.</p></aside><div id="nameModal" class="modal" hidden><div class="modalCard"><b>BARANUS / PROFILE</b><p>Напишите свой никнейм</p><input id="firstNickname" maxlength="16" placeholder="Player" autofocus><small>3–16 латинских букв, цифр или _</small><button id="firstNicknameSave">Продолжить</button></div></div><script src="renderer.js"></script></body></html>
