<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baranus Launcher</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div class="mark">B</div><div><b>BARANUS</b><small>LAUNCHER · FORGE 1.12.2</small></div><span class="online">● ГОТОВ</span></header>
<section class="welcome"><p></p><h1><em>Добро пожаловать!</em><br></h1><span>Galacticraft · Forge 1.12.2</span></section>
<section class="card"><div><label>НИКНЕЙМ<input id="nickname" maxlength="16" placeholder="Player" value="Player"></label><div class="ram"><div><span>ОПЕРАТИВНАЯ ПАМЯТЬ</span><b id="ramValue">4 ГБ</b></div><input id="ram" type="range" min="1" max="4" step="1"><small id="ramHint">Максимум для этого ПК: 4 ГБ</small></div></div><div class="steps"><button id="java" class="step"><span><strong>Установить Java 8</strong><small>Скачается автоматически</small></span><i>↓</i></button><button id="minecraft" class="step"><span><strong>Установить Minecraft</strong><small>Игра, Forge, моды и все игровые библиотеки</small></span><i>↓</i></button><button id="play" class="step play"><span><strong>Играть</strong><small>Запустить сборку</small></span><i>▶</i></button></div><div class="install"><div><span id="status">Сначала установи Java 8</span><span id="progressText">0%</span></div><div class="progress"><div id="progressFill"></div></div></div></section>
<footer><button id="mods">Папка mods</button><button id="shaders">Папка shaderspack</button><button id="resources">Папка resourcepack</button><button id="update" hidden>Проверить обновления</button><details><summary>Журнал</summary><pre id="log"></pre></details></footer>
</main><script src="renderer.js"></script></body></html>
